          - generic [ref=e108]: About us
          - paragraph [ref=e110]: Western Ships Agency is a subsidiary company of BLRT Grupp – leading industrial holding in the Baltics, established in 2002. Our core activity is to provide the best assistance in Klaipeda and Tallinn ports to the ship owners and operators for any matters during the vessel‘s stay in ports. Our strongest side is to provide multipurpose agency services for long-term extraordinary projects for all types of vessel calls, to organize general and oversized-cargo delivery chartering or freight forwarding projects, to deliver any matters of ship supply – from technical spares to provision supply.
