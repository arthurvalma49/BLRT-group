            - generic [ref=e90]: About us
            - generic [ref=e91]:
              - paragraph [ref=e92]: Transport company ELME Trans renders international transportation and equipment rental services.
              - paragraph [ref=e93]: The company was founded in 2001 and is a subsidiary of BLRT Grupp, the leading industrial holding in the Baltics.
              - paragraph [ref=e94]: Branch offices of the company are located in Estonia, Latvia, Lithuania, Ukraine and offer dangerous, bulky and heavy cargo shipping services in the Baltic States, Scandinavia, Eastern and Western Europe.
              - paragraph [ref=e95]: Since 2014 ELME Trans has the status of an authorized economic operator of the European Union.
              - paragraph [ref=e96]: In Estonia and Lithuania, ELME Trans rents a total of more than 300 units of various equipment, including telescopic loaders and scissor lifts, diesel and battery lifts with a load- lifting height up to 41 meters, forklift tracks, office cabins and scaffolding.
