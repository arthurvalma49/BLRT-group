        - generic [ref=e69]:
          - paragraph [ref=e70]: Each subsidiary is a reliable partner in its field – whether it is shipbuilding or ship repair, manufacturing of high-technology equipment and sophisticated metal structures, rolled metal products and metalworking services, mechanical engineering, gases production and sale, transport services, port and other services, real estate development.
          - paragraph [ref=e71]: The holding employs about 4 000 people.
          - paragraph [ref=e72]: For over 113 years concern does not stop there and keeps up with the times, constantly expanding its capabilities.
