          - heading "Our Story" [level=2] [ref=e30]
          - paragraph [ref=e31]: BLRT Grupp traces its origins to the Tallinn shipyard established in 1912, then one of the largest industrial facilities in the Russian Empire. Through a century of transformation, spanning two world wars, Soviet industrialisation, Estonian independence and Baltic integration into the European Union, the group evolved into the diversified industrial holding it is today.
          - paragraph [ref=e32]: "Today, BLRT Grupp operates 17 companies across Estonia, Latvia, Lithuania, Finland and Norway. Our core competencies remain maritime: ship repair, shipbuilding and marine services. The group has grown to encompass engineering, materials, logistics and industrial gas production."
          - paragraph [ref=e33]: Headquartered at Kopli, Tallinn (the historic heart of Estonian maritime industry), BLRT Grupp continues to grow through strategic partnerships and organic development. Commitment to Baltic industrial tradition and engineering quality unites every company in the group.
