        - generic [ref=e80]: Docks and berths in Estonia
        - paragraph [ref=e81]: Throughout its century-long history, Tallinn Shipyard has continuously advanced towards greater environmental responsibility. We take deliberate steps to reduce our ecological footprint by implementing modern equipment, adopting innovative vessel-cleaning technologies, and upgrading our capacities. Our newly commissioned 180m floating dock, operational since August 2024, exemplifies this commitment to sustainability and efficiency. At Tallinn Shipyard, our meticulous attention to detail earns the trust of our clients, making us a reliable partner for ship repair needs.
        - link "Read more " [ref=e82] [cursor=pointer]:
          - /url: https://blrtyards.com/en/docks-and-berths-in-estonia/
          - generic [ref=e83]: Read more
          - generic [ref=e84]: 
        - generic [ref=e87]: Docks and berths in Lithuania
        - paragraph [ref=e88]: With three floating docks, including the largest in the Baltics, Western Shiprepair can undertake extensive repair and modernization projects for Aframax, Panamax, and Post-Panamax vessels. Our expertise and capabilities allow us to efficiently manage large-scale projects, providing cost-effective solutions for vessel owners. Known for flexibility and reliability, Western Shiprepair stands as the ideal choice for comprehensive ship repairs in the Baltic region.
        - link "Read more " [ref=e89] [cursor=pointer]:
          - /url: https://blrtyards.com/en/docks-and-berths-in-lithuania/
          - generic [ref=e90]: Read more
          - generic [ref=e91]: 
        - generic [ref=e94]: Docks and berths in Finland
        - paragraph [ref=e95]: Home to one of the largest drydocks in Northern Europe, Turku Repair Yard combines the best traditions of ship repair with a personalized, transparent approach. With extensive experience and a focus on seamless customer experience, we ensure every dry-docking project is smooth and worry-free. At Turku Repair Yard, our commitment to quality and attention to detail make us a trusted partner for advanced repair solutions.
        - link "Read more " [ref=e96] [cursor=pointer]:
