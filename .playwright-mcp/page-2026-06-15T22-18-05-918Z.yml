        - generic [ref=e205]:
          - paragraph [ref=e206]: Health, Safety & Environmental policy Statement is our top priority for Safety and Health of our employees.
          - paragraph [ref=e207]: Safety induction training is performed for anyone coming to MOC production workshops.
          - paragraph [ref=e208]: QHSE Department is QHSE Manager, HSE Engineer, Metrology Engineer and 3 QC inspectors (VT2).
          - list [ref=e209]:
            - listitem [ref=e210]: Quality planning, ITP and HSE plan are in accordance with project specific requirements.
            - listitem [ref=e211]: Regular customer audits
            - listitem [ref=e212]: QMS procedures cover most of the general quality requirements. Project operational procedures are created for project specific scope and needs.
            - listitem [ref=e213]: Quality and HSE requirements are communicated to subcontractors (if any) and included in their procedures for the project.
