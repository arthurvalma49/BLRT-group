      - generic [ref=e97]:
        - generic [ref=e98]:
          - generic [ref=e99]: About us
          - generic [ref=e100]:
            - paragraph [ref=e101]: Marketex Marine offers solutions for the small shipbuilding and fish farming markets from project design and development through to the finished product delivery to the customer. The company is the leader in the construction of steel fish feeding barges.
            - paragraph [ref=e102]: Marketex Marine has been operating in the Norwegian market since 2000. We have constructed more than 400 feed barges for our customers, thus, making a significant contribution to Norwegian aquaculture. Being able to offer high-quality products and maintain barge construction deadlines, we have a serious competitive advantage over other companies. Our flexibility and customer loyalty explain our working with Norwegian customers for more than 20 years.
            - paragraph [ref=e103]: With highly qualified specialists, state-of-the-art equipment and direct access to the sea, we are able to handle large-scale projects of high complexity.
            - paragraph [ref=e104]: Marketex Marine-built barges with feed storage capacities ranging from 100 to 900 tonnes are successfully operating worldwide, from Japan to Chile and from Norway to Greece.
            - paragraph [ref=e105]: Marketex Marine offers sophisticated large-sized carbon steel solutions for the small shipbuilding and fish farming industries.
            - paragraph [ref=e106]: Design development, construction, painting, piping, electrical works and electric installation, hydraulic and pneumatic equipment installation, lining, and outfitting are all part of the services performed by Marketex Marine on turnkey projects.
