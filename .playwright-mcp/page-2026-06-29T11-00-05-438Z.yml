      - generic [ref=e65]:
        - generic [ref=e71]:
          - paragraph [ref=e72]: As one of the largest industrial corporations in the Baltics, BLRT Grupp, as a member of the Estonian Employers Confederation more than 15 years and Chamber of Commerce and Industry since 1989, is actively involved in shaping the Estonian employers’ positions on many issues.
          - paragraph [ref=e73]: The enterprises of BLRT Grupp are members of the Community of European Shipyards’ Associations, the Estonian Machine Building Union, the Estonian Defense Industry Association, the Estonian Wind Power Association, the Lithuanian Cluster of Liquefied Natural Gas, as well as of the Union of the Lithuanian Confederation of Industry.
        - generic [ref=e78]:
          - generic [ref=e79]:
            - img "ico-1" [ref=e81]
            - text: Sport
          - paragraph [ref=e84]: For years, BLRT Grupp actively contributes to the development and promotion of sports in Estonia and Lithuania, as an official partner of the male and female national basketball teams of Estonia and as the general sponsor of the Lithuanian basketball club “BC Neptūnas”. For many years the holding has promoted the development of the Estonian men’s tennis and other sports.
        - generic [ref=e88]:
          - generic [ref=e89]: Education
          - paragraph [ref=e92]: The holding places high emphasis on training of new professionals, in cooperation with the Tallinn University of Technology, the Estonian Maritime Academy, the Lithuanian Maritime Academy, the University of Klaipėda and other institutions.
        - generic [ref=e97]:
          - generic [ref=e98]: Culture
          - paragraph [ref=e101]:
            - text: Considering the development of culture as an integral part of the development of society, BLRT Grupp has a long-standing cooperation with the
            - link "Südalinna Theater" [ref=e102] [cursor=pointer]:
              - /url: https://www.sudalinnateater.ee/en
            - text: ", supports various cultural and public events, such as the Saaremaa Opera Days, Days of the Sea and many others. BLRT Grupp was honored by the Estonian Ministry of Culture with a title of “A Friend of Culture” in 2014, 2018, 2023, 2024 and 2025."
        - generic [ref=e106]:
          - generic [ref=e107]: BLRT fond
          - generic [ref=e109]:
            - paragraph [ref=e110]: As one of the largest industrial holding, we consider it important to develop and promote higher technical education. To support young talents in higher education, the BLRT Fond was established by the concern at the Estonian National Culture Foundation. Each year, several talented students receive scholarships from the foundation.
            - paragraph [ref=e111]: Applications for scholarships can be submitted by students in the field of mechanical engineering, ship repair, shipbuilding, foundry, welding, offshore industry, economics and information technology. The scholarship amount is 2,000 euro.
            - paragraph [ref=e112]:
              - text: Scholarship applications are accepted every year from September 1st to October 15th in the Estonian National Culture Foundation application form found on the Estonian National Culture Foundation website
              - link "https://ankeet.erkf.ee" [ref=e113] [cursor=pointer]:
                - /url: https://ankeet.erkf.ee
              - text: .
