        - generic [ref=e122]:
          - generic [ref=e124]:
            - heading "Visioon" [level=3] [ref=e125]
            - generic [ref=e126]: Elme Trans’i eesmärk on olla oma klientidele ja äripartneritele usaldusväärne ja pikaaegne partner, edendada nende äri.
          - generic [ref=e128]:
            - heading "Missioon" [level=3] [ref=e129]
            - generic [ref=e130]: Meie ülesanne on pakkuda klientidele parimaid lahendusi veoteenuste osutamisel ja tööstusseadmete rentimisel. Teeme oma tööd partneri jaoks nõutaval ja tema kasvuks vajalikul tasemel. Arendame ja täiustame pakutavaid teenuseid klientide vajadusi ja ootusi arvestades, tagades neile usaldusväärse ja kvaliteetse teeninduse.
          - generic [ref=e132]:
            - heading "Strateegia" [level=3] [ref=e133]
            - generic [ref=e134]: Tugevdame oma liidripositsiooni veoteenuste ja ehitusmasinate rendi sihtturgudel. Arendame pidevalt oma ettevõtet, seadmeparki, töömeetodeid ja laieneme geograafiliselt, et rahuldada parimal moel meie klientide vajadusi ning säästa keskkonda. Elme Trans on atraktiivne tööandja.
