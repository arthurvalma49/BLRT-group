            - generic [ref=e90]: Ettevõttest
            - generic [ref=e91]:
              - paragraph [ref=e92]: ELME Trans pakub oma klientidele siseriiklikke ja rahvusvahelisi transporditeenuseid.
              - paragraph [ref=e93]: Ettevõtte asutati 2001. aastal Baltimaade suurima tööstuskontserni BLRT Grupp tütarettevõttena.
              - paragraph [ref=e94]: Ettevõte on esindatud Eestis, Lätis, Leedus ja Ukrainas, pakkudes lahendusi ohtlike, suurte ja raskete veoste vedamiseks Balti riikides, Skandinaavias, Ida- ja Lääne-Euroopas.
              - paragraph [ref=e95]:
                - text: 2014 aastal sai Elme Trans Euroopa Liidu volitatud ettevõtja (
                - emphasis [ref=e96]: Authorised Economic Operator – AEO
                - text: ) staatuse.
              - paragraph [ref=e97]: ELME Trans rendib Eestis ja Leedus üle 300 eri seadme, sealhulgas poom-, käär-, diisel- ja akutõstukeid kuni 41-meetrise tõstekõrgusega, samuti kahveltõstukeid, kontori- ja olmesoojakuid ning ehitustellinguid.
          - generic [ref=e98]:
            - generic [ref=e100]:
              - img "ico-1" [ref=e102]
              - generic [ref=e104]:
                - strong [ref=e105]: "4"
                - text: Riiki
            - generic [ref=e107]:
