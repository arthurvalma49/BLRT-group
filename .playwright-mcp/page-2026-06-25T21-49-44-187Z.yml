        - generic [ref=e39]: About us
        - generic [ref=e40]:
          - paragraph [ref=e41]: Tehnomet Survey is an actively developing service company, operating in the field of ship repair and inspection of hull structures of marine vessels, founded in 1998.
          - paragraph [ref=e42]: We operate worldwide. Our technicians have all the necessary documents to arrive at the client’s vessel as soon as possible, wherever it is.
          - paragraph [ref=e43]: We are convinced that safety is a fundamental aspect of the marine business structure and follow this principle over 20 years.
          - paragraph [ref=e44]
      - generic [ref=e46]:
        - generic [ref=e47]: Certificates
        - generic [ref=e48]:
          - paragraph [ref=e49]: "In its industrial and commercial activities, Tehnomet Survey is guided by recognized quality management systems certified in accordance with the ISO 9001: 2015 requirements."
          - paragraph [ref=e50]: The company is approved by the classification societies BV, LR, DNV, RINA, ABS, KR, IR, NKK, WTA.
      - generic [ref=e54]:
        - generic [ref=e55]: Vision
        - paragraph [ref=e57]: To become the most sought-after and successful company in the field of hull structure inspection.
      - generic [ref=e61]:
        - generic [ref=e62]: Mission
        - paragraph [ref=e64]: We provide professional technical control and guarantee best supervision of ship hulls and metal structures condition either before or after steel renewal, thereby contributing to the stable and safe prosperity of our customers’ business.
      - generic [ref=e68]:
        - generic [ref=e69]: Strategy
        - paragraph [ref=e71]: We pursue constantly to strengthen our market position. Systematic improvement of operating procedures and regular updating of applied equipment; introduction of new technologies, diversity of services and comprehensive training of the personnel involved in the process; constant quality control, long-term database and immediate feedback – all our activities are aimed to become market leader and ensure the highest quality of the product and 100% satisfaction of our customers.
