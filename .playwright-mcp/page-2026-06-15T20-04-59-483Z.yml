      - generic [ref=e47]:
        - paragraph [ref=e48]: What we do
        - heading "Services & Capabilities" [level=2] [ref=e49]
        - generic [ref=e50]:
          - generic [ref=e51]:
            - img [ref=e53]
            - heading "Ship Repair & Dry Docking" [level=3] [ref=e56]
            - paragraph [ref=e57]: Three dry docks — the largest (Dock 22) at 165 m × 30 m, 10,000 t — with 2,300 m of berths and vessels up to 200 m alongside.
            - generic:
              - paragraph [ref=e58]: "Tallinn Shipyard operates three dry docks: Dock 2 (4,500 t, 101.00 m × 22.00 m), Dock 34 (8,500 t, 139.50 m × 23.80 m), and Dock 22 (10,000 t, 165.00 m × 30.00 m). Supporting equipment includes a floating crane of 100 t capacity, a mobile crane of 850 t, and lifting platforms rated at 250 t and 500 t."
              - paragraph [ref=e59]: With 2,300 m of berths and 1,200 m of quays fully equipped with fresh water, compressed air and electrical power, the yard accommodates vessels up to 200 m in length alongside. Hull blasting, coating and structural steel works are performed in the dry dock to classification society requirements.
            - button "Read more" [ref=e60] [cursor=pointer]:
              - text: Read more
              - img [ref=e61]
          - generic [ref=e63]:
            - img [ref=e65]
            - heading "Afloat Repairs & Voyage Repair Services" [level=3] [ref=e69]
            - paragraph [ref=e70]: Repairs carried out while vessels remain in water, including steel, piping, deck machinery, propulsion, electrical and emergency technical assistance.
            - paragraph [ref=e71]: "Tallinn Shipyard provides afloat repair services covering: minor steel repairs and structural works in accessible areas; piping repairs, renewal and installation; valve repairs, overhaul and pressure testing where systems can be safely isolated; replacement or maintenance of anchor chains and related deck equipment; selected stern tube seal works depending on vessel design; deck machinery repairs including mooring equipment, winches and windlasses; hatch cover, ramp and cargo access equipment repairs; safety and lifesaving equipment maintenance; engines and auxiliary machinery repairs including pumps and heat exchangers; electrical, automation, control and instrumentation works; inspection, troubleshooting and repair preparation before dry docking; and emergency technical assistance and voyage repair support."
            - button "Read more" [ref=e72] [cursor=pointer]:
              - text: Read more
              - img [ref=e73]
          - generic [ref=e75]:
            - img [ref=e77]
            - heading "Conversion and Modernization" [level=3] [ref=e81]
            - paragraph [ref=e82]: Vessel upgrades, structural modifications, cargo area modifications, propulsion and energy-efficiency upgrades, and class-related modernisation.
            - generic:
              - paragraph [ref=e83]: Whether the goal is to improve vessel performance, meet new regulatory requirements, increase operational flexibility, or extend the service life of an existing asset, BLRT Repair Yards provides practical ship conversion and modernisation solutions across our multi-yard network.
              - paragraph [ref=e84]: "Typical projects include: vessel upgrades and life-extension work; structural modifications and steel fabrication; cargo area modifications and capacity improvements; new equipment and system installation; propulsion and energy-efficiency upgrades; electrical, automation and control system modernisation; accommodation, deck and service area modifications; and class-related modernisation and inspection support."
            - button "Read more" [ref=e85] [cursor=pointer]:
              - text: Read more
              - img [ref=e86]
          - generic [ref=e88]:
            - img [ref=e90]
            - heading "Retrofit" [level=3] [ref=e92]
            - paragraph [ref=e93]: Equipment and system retrofits to meet new regulatory requirements and improve vessel performance.
            - paragraph [ref=e94]: Tallinn Shipyard performs vessel retrofit projects to help owners meet changing regulatory requirements and improve operational efficiency. Retrofit work is delivered using the yard's ship repair expertise, engineering support, project management and multi-disciplinary production capabilities. The yard coordinates with sister companies within BLRT Grupp for specialist electrical, NDT and engineering scope.
            - button "Read more" [ref=e95] [cursor=pointer]:
              - text: Read more
              - img [ref=e96]
          - generic [ref=e98]:
            - img [ref=e100]
            - heading "Inspections" [level=3] [ref=e103]
            - paragraph [ref=e104]: Vessel condition assessment, repair scope evaluation, class renewal and docking preparation support.
            - generic:
              - paragraph [ref=e105]: "Inspection services at Tallinn Shipyard include: vessel condition assessment before dry docking or repair; repair scope evaluation based on inspection findings; class renewal and class survey preparation support; hull, deck, tank, piping, machinery and equipment inspection support; identifying steel renewal needs, pipe work requirements, coating repairs and mechanical repair needs; and docking preparation and technical clarification of repair specifications."
              - paragraph [ref=e106]: These services help determine vessel condition, establish repair requirements, estimate work scope and select appropriate repair approaches — improving cost management, enabling safer execution and minimising downtime.
            - button "Read more" [ref=e107] [cursor=pointer]:
              - text: Read more
              - img [ref=e108]
          - generic [ref=e110]:
            - img [ref=e112]
            - heading "Design & Engineering" [level=3] [ref=e118]
            - paragraph [ref=e119]: Technical planning and engineering support for repair, conversion and modernisation projects.
            - paragraph [ref=e120]: The yard's engineering support capability covers technical planning, design development and project management for repair, conversion and modernisation scopes. Engineering support is combined with the yard's multi-disciplinary production capabilities to deliver practical solutions. Close coordination with BLRT Grupp's specialist companies — including BLRT ERA for electrical engineering and Tehnomet Survey for NDT — allows complex, multi-discipline projects to be managed under a single commercial interface.
            - button "Read more" [ref=e121] [cursor=pointer]:
              - text: Read more
              - img [ref=e122]
