        - heading "Tallinn Shipyard" [level=1] [ref=e27]
        - paragraph [ref=e28]: Ship repair, conversion and dry docking at the Port of Tallinn, Estonia. Three dry docks with the largest at 165 m × 30 m, plus 2,300 m of berths.
      - generic [ref=e30]:
        - generic [ref=e31]:
          - paragraph [ref=e32]: About Tallinn Shipyard
          - generic [ref=e33]:
            - paragraph [ref=e34]: The BLRT Repair Yards team is dedicated to delivering quality results through precise planning and seamless collaboration. Tallinn Shipyard operates from Kopli 103 in Tallinn, Estonia, as part of BLRT Repair Yards — a group of ship repair yards serving the international maritime market from three strategic locations in the Baltic Sea region.
            - paragraph [ref=e35]: The yard's mission is to ensure the seaworthiness and performance of the global fleet, helping shipowners and operators maintain existing vessels, improve efficiency, meet regulatory requirements and move towards more sustainable maritime operations. Three dry docks accommodate vessels from coastal craft to large tankers, with the largest dock (Dock 22) measuring 165 m × 30 m at 10,000 t lifting capacity.
