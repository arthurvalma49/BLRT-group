                - strong [ref=e147]: Non-destructive testing (NDT)
            - paragraph [ref=e148]: Accredited by the Nacionalinis akreditacijos biuras accreditation bureau and recognized by the Bureau Veritas, DNV-GL and Russian Maritime Register of Shipping Classification Societies.
            - paragraph [ref=e149]:
              - strong [ref=e150]: NDT
              - text: is conducted in compliance with the operational standards and requirements according to LST EN ISO, ASTM, AWS, DN-VGL.
            - list [ref=e151]:
              - listitem [ref=e152]:
                - strong [ref=e153]: Ultrasonic thickness measurement (UTM)
            - paragraph [ref=e154]: Recognized by the Bureau Veritas, DNV-GL, Lloyd‘s Register, Registro Italiano Navale and Russian Maritime Register of Shipping Classification Societies.
            - paragraph [ref=e155]: "The activities of Western Central Laboratory are wide-ranging, and our specialists can conduct tests and provide services not only in the laboratories of the company but also at customer sites, such as ships, factories, oil company premises, and construction units. The company specialists can also carry out work at high altitudes, as they hold the necessary permits: they are certified in compliance with the IRATA requirements. The testing work in high-rise facilities is carried out using professional rope access worker’s equipment and in compliance with the necessary safety requirements and usually, without the need for scaffolding and cranes, which helps to reduce the costs."
