            - paragraph [ref=e137]:
              - strong [ref=e138]: WESTERN CENTRAL LABORATORY
              - text: – daughter-company of WESTERN SHIPYARD GROUP, established as an enterprise in 2003, after reorganization of former ship-repair yard. This means our experience is reaching distant 1969, learning lessons and gathering best experience throughout the time.
            - paragraph [ref=e139]:
              - strong [ref=e140]: WESTERN CENTRAL LABORATORY
              - text: "is a company accredited and recognized by the classification societies that carry out its operations in accordance with the established requirements and standards:"
            - list [ref=e141]:
