          - generic [ref=e102]: About us
          - generic [ref=e103]:
            - paragraph [ref=e104]: "BLRT Repair Yards is a group of ship repair yards serving the international maritime market from three strategic locations in the Baltic Sea region: Estonia, Lithuania and Finland."
            - paragraph [ref=e105]: Across our yards, we support shipowners with reliable ship repair, retrofit, conversion, modernisation and green solutions.
            - paragraph [ref=e106]: We understand what a repair period means for our clients. It is a docking window, a schedule, a budget, a class requirement, an operational commitment and a vessel that needs to return to service safely and on time.
            - paragraph [ref=e107]: "That is why we focus on what matters most: careful planning, clear communication, practical technical solutions, safe execution and reliable project management. From routine maintenance and class-related repairs to complex multi-discipline projects, our teams work to keep vessels seaworthy, compliant, efficient and ready for their next assignment."
            - paragraph [ref=e108]: As part of BLRT Grupp, one of the largest industrial holdings in the Baltic Sea region, BLRT Repair Yards is supported by strong industrial heritage, engineering expertise, production capacity and a broad network of specialised technical companies.
            - paragraph [ref=e109]: Our mission is to ensure the seaworthiness and performance of the global fleet, helping shipowners and operators maintain existing vessels, improve efficiency, meet regulatory requirements and move towards more sustainable maritime operations.
