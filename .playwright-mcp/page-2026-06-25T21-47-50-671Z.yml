          - generic [ref=e67]: About us
          - generic [ref=e68]:
            - paragraph [ref=e69]: Western Baltija Shipbuilding is a modern shipyard offering full range of services from conceptual design to “turn-key” solutions. Company is a part of Western Shipyard Group which belongs to the leading industrial holding in the Baltic Sea region – BLRT Grupp.
            - paragraph [ref=e70]: The main direction of Western Baltija Shipbuilding strategy is building “turn key” vessels, hulls and steel blocks. Our team offers accumulated experience and new ideas, which are recognized and valued by our world-known customers.
            - paragraph [ref=e71]: Western Baltija Shipbuilding, having implemented a huge number of different projects, is one of the most experienced shipyards in the Baltic region. Ice-free Klaipeda port allows uninterrupted business operations all over the year. High quality and on-time deliveries are secured by more than 350 highly skilled employees whose training and professional development is constantly being improved.
