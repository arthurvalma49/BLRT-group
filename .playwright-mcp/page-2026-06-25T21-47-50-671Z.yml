      - generic [ref=e191]:
        - generic [ref=e193]: History
        - generic [ref=e194]:
          - paragraph [ref=e195]: The Western Baltija Shipbuilding’s history began in 1946, when was decided to expand and develop the country’s shipbuilding sector. And the decision included construction of a shipyard in the Baltic Sea basin…
          - paragraph [ref=e196]: The construction of the Baltic shipbuilding yard commenced in February 1947 in the territory of swamps with deep channels and trenches. By June 1952 the shipyard was established although construction itself continued until completion in 1958.
          - paragraph [ref=e197]: The purpose of the shipyard was the construction of fishing trawlers. But the starting point, prior to the full manning and the building of the yard, was the production of barges. Shipbuilders laid down the first keel of dry cargo dump barge in October 1952.
        - link "Read more " [ref=e199] [cursor=pointer]:
          - /url: /en/history/
